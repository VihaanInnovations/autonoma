# ────────────────────────────────────────────────────────────────────────
# Sample .pre-commit-config.yaml
#
# Copy this file to the root of YOUR repo and rename it to:
#   .pre-commit-config.yaml
#
# Then run:
#   pip install pre-commit
#   pre-commit install
#
# Autonoma will now run automatically before every `git commit`.
# ────────────────────────────────────────────────────────────────────────
repos:
  - repo: https://github.com/Vithushan/Autonoma_Community_CI
    rev: v0.1.3   # pin to a release tag or commit SHA
    hooks:
      - id: autonoma
        # Optional: enable auto-fix (modifies files + re-stages them)
        # args: ["--auto-fix"]

        # Optional: scan extra file types beyond Python
        # args: ["--include-ext", ".js", "--include-ext", ".ts"]

        # Optional: override file types pre-commit sends
        # types_or: [python, javascript, ts]
