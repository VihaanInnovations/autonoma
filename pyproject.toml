[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonoma-cli"
version = "0.1.3"
description = "Deterministic code security scanner. Detects and remediates hardcoded secrets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "colorama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
autonoma = "autonoma.cli:main"

[project.urls]
Homepage = "https://github.com/Vithushan/Autonoma_Community_CI"
Issues = "https://github.com/Vithushan/Autonoma_Community_CI/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_acceptance.py --ignore=tests/test_harness.py --ignore=tests/test_repo_categories.py"
