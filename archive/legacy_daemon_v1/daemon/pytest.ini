[pytest]
# Pytest configuration for CodeSentinal tests

# Register custom markers
markers =
    integration: marks tests as integration tests (requires actual test execution)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

