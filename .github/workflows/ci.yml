name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Build package ─────────────────────────────────────────
      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      # ── Install from wheel (not editable) ─────────────────────
      - name: Install wheel in clean environment
        run: pip install dist/*.whl
        shell: bash

      # ── CLI smoke tests ───────────────────────────────────────
      - name: autonoma --version
        run: autonoma --version

      - name: autonoma --help
        run: autonoma --help

      - name: Scan demo-project (text)
        # Expected exit code 1 because findings exist
        run: autonoma scan demo-project/src || if [ $? -eq 1 ]; then echo "Findings detected as expected"; else exit 1; fi
        shell: bash

      - name: Scan demo-project (JSON)
        # Scan always outputs JSON now, no format flag needed
        run: autonoma scan demo-project/src || if [ $? -eq 1 ]; then echo "JSON findings detected"; else exit 1; fi
        shell: bash

      - name: Dry-run fix
        # Use modern 'fix' command with --diff
        run: autonoma fix demo-project/src --diff --dry-run
        shell: bash

      - name: Verify exit code 1 on findings
        # Confirm that findings lead to exit code 1
        run: |
          autonoma scan demo-project/src
          if [ $? -eq 1 ]; then
            echo "Correct: Exit code 1 on findings"
            exit 0
          else
            echo "Error: Expected exit code 1"
            exit 1
          fi
        shell: bash
