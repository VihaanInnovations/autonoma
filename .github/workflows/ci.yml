name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Build package ─────────────────────────────────────────
      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      # ── Install from wheel (not editable) ─────────────────────
      - name: Install wheel in clean environment
        run: pip install dist/*.whl
        shell: bash

      # ── Unit tests ────────────────────────────────────────────
      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest -q

      # ── CLI smoke tests ───────────────────────────────────────
      - name: autonoma --version
        run: autonoma --version

      - name: autonoma --help
        run: autonoma --help

      - name: Scan demo-project — expect findings (exit 1)
        run: |
          code=0
          autonoma scan demo-project/src || code=$?
          [ "$code" -eq 1 ] || { echo "Expected exit 1, got $code"; exit 1; }
        shell: bash

      - name: Dry-run fix — expect findings (exit 1)
        run: |
          code=0
          autonoma fix demo-project/src --diff --dry-run || code=$?
          [ "$code" -eq 1 ] || { echo "Expected exit 1, got $code"; exit 1; }
        shell: bash
